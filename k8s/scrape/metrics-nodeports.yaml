apiVersion: v1
kind: Service
metadata:
  name: checkout-svc-metrics
  namespace: aegispilot
  labels:
    app: checkout-svc
    team: aegis
    tier: scrape
    purpose: prometheus
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "30081"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: checkout-svc
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30081
---
