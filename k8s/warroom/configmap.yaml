apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-warroom-config
  namespace: aegispilot
  labels:
    app: aegis-warroom
    team: aegis
data:
  BACKEND: cloud
  ORCHESTRATOR: adk
  PUBSUB_MODE: pull
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GOOGLE_CLOUD_LOCATION: us-central1
  VERTEX_LOCATION: global
  GEMINI_MODEL: gemini-3.5-flash
  GEMINI_MODEL_PRO: gemini-2.5-pro
  REMEDIATION_MODE: kubernetes
  K8S_NAMESPACE: aegispilot
  K8S_ACTIVE_SERVICE: aegis-warroom
  K8S_BLUE_DEPLOYMENT: aegis-warroom-blue
  K8S_GREEN_DEPLOYMENT: aegis-warroom-green
  HOST: 0.0.0.0
  PORT: "8080"
  GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/gcp-sa.json
