apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis-warroom
  namespace: aegispilot
  labels:
    app: aegis-warroom
    team: aegis
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegis-warroom
  namespace: aegispilot
  labels:
    app: aegis-warroom
    team: aegis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aegis-warroom
subjects:
  - kind: ServiceAccount
    name: aegis-warroom
    namespace: aegispilot
