apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-warroom
  namespace: aegispilot
  labels:
    app: aegis-warroom
    team: aegis
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegis-warroom
                port:
                  number: 80
