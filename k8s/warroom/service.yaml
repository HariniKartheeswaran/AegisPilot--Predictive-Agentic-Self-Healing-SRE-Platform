apiVersion: v1
kind: Service
metadata:
  name: aegis-warroom
  namespace: aegispilot
  labels:
    app: aegis-warroom
    team: aegis
    slot: blue
spec:
  type: ClusterIP
  selector:
    app: aegis-warroom
    slot: blue
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
