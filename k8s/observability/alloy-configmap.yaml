apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: aegispilot
  labels:
    app: alloy
    team: aegis
data:
  # Push URL for team3-observability Loki (must be reachable from K3s node).
  LOKI_PUSH_URL: "http://3.111.113.151:3100/loki/api/v1/push"
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "aegispilot_pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "aegispilot"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_tier"]
        target_label  = "tier"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.aegispilot_pods.output
      forward_to = [loki.process.drop_noisy.receiver]
    }

    loki.process "drop_noisy" {
      forward_to = [loki.write.default.receiver]

      stage.static_labels {
        values = {
          cluster = "aegispilot-k3s",
        }
      }
    }

    loki.write "default" {
      endpoint {
        url = env("LOKI_PUSH_URL")
      }
    }
