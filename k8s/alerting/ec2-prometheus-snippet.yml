# Snippet for the EC2 Prometheus host (3.111.113.151) — final/K8s path.
# Merge into that host's prometheus.yml (do not replace the whole file blindly).
#
# 1) Copy k8s/alerting/rules.yml onto the host, e.g. /etc/prometheus/aegis_rules.yml
# 2) Add the blocks below
# 3) Reload Prometheus: curl -X POST http://127.0.0.1:9090/-/reload
#
# Replace NODE_IP with a K3s node IP reachable from the Prom host
# (same network path you already use for NodePorts 30081–30083).

rule_files:
  - /etc/prometheus/aegis_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "NODE_IP:30903"
