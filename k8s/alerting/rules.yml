# Aegis scrape SLO rules — EC2 Prometheus (real Prom → AM → War Room path).
# Group interval 15s so Warning/Critical can Pending→Firing within ~30–45s of a live inject.
groups:
  - name: aegis_scrape
    interval: 15s
    rules:
      - alert: HighErrorRateWarning
        expr: |
          (
            sum by (service) (rate(http_requests_total{code=~"5.."}[30s]))
            /
            clamp_min(sum by (service) (rate(http_requests_total[30s])), 0.001)
          ) > 0.08
        for: 15s
        labels:
          severity: warning
          stage: pre
        annotations:
          summary: "Elevated 5xx rate on {{ $labels.service }}"
          description: "Error rate is above 8% (pre-alert)."
          value: "{{ $value }}"

      - alert: HighErrorRate
        expr: |
          (
            sum by (service) (rate(http_requests_total{code=~"5.."}[30s]))
            /
            clamp_min(sum by (service) (rate(http_requests_total[30s])), 0.001)
          ) > 0.20
        for: 30s
        labels:
          severity: critical
          stage: full
        annotations:
          summary: "High 5xx rate on {{ $labels.service }}"
          description: "Error rate is above 20% (full incident)."
          value: "{{ $value }}"
