# ==============================================================================
# SonarQube Project Configuration for Aegisops SRE Platform
# ==============================================================================

# Unique project identification
sonar.projectKey=AegisPilot
sonar.projectName=Aegisops SRE Platform
sonar.projectVersion=1.0.0

# Source code directories (excludes tests, vendor, frontend artifacts)
sonar.sources=backend
sonar.sourceEncoding=UTF-8

# Test directories
sonar.tests=tests

# File inclusion and exclusion patterns
sonar.exclusions=**/__pycache__/**,**/*.pyc,frontend/**,reports/**,venv/**,.venv/**
sonar.test.inclusions=tests/**,backend/tests/**

# Python test reporting and coverage paths
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# Quality gate settings
sonar.qualitygate.wait=false

# Demo scrape pods speak cleartext HTTP on :8080 (no TLS) — not a product risk.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=**/live_fire.py

# Demo/seed generators, K8s-only Fire/snapshot render, and K8s remediation
# executor are exercised in cluster demos — exclude from coverage denominator.
sonar.coverage.exclusions=\
  **/seed/**,\
  **/services/live_fire.py,\
  **/services/live_snapshot.py,\
  **/tools/remediation.py,\
  **/adk/tools.py
