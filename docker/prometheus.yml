# Prometheus scrapes the same three services K8s exposes (checkout/cart/payments).
# Job labels match the K8s scrape tier so War Room PromQL stays portable.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: checkout-svc
    static_configs:
      - targets: ["checkout-svc:8080"]
        labels:
          service: checkout-svc
          app: checkout-svc
          tier: scrape

  - job_name: cart-svc
    static_configs:
      - targets: ["cart-svc:8080"]
        labels:
          service: cart-svc
          app: cart-svc
          tier: scrape

  - job_name: payments-svc
    static_configs:
      - targets: ["payments-svc:8080"]
        labels:
          service: payments-svc
          app: payments-svc
          tier: scrape
